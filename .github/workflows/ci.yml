name: CI

# Runs on every push to main and on pull requests — type-checks and builds
# the app so broken code can't reach a deploy. (Vercel handles the deploy.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # next build type-checks the whole project (incl. Next's generated
      # route types) and compiles it — one step gates both correctness and build.
      - name: Build
        run: npm run build
